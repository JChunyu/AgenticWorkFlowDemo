name: release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag, manifest.version and package.json.version agree
        run: |
          node -e '
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME;
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (manifest.version !== pkg.version || manifest.version !== tag) {
            console.error("version mismatch: tag=" + tag + " manifest=" + manifest.version + " package=" + pkg.version);
            process.exit(1);
          }
          console.log("versions agree: " + tag);
          '

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The community review runs this same rule set; a release never ships a
      # bundle the reviewer would reject on source grounds.
      - name: Lint against the review rule set
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify generated docs
        run: node scripts/verify-docs.mjs

      - name: Assert release artifacts exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      # Provenance for the exact bytes shipped below, so anyone can run:
      #   gh attestation verify main.js -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            main.js
            manifest.json
            styles.css

      # The attestation above is only worth anything if it matches the bytes that were
      # actually attached, so the release verifies itself before the job goes green.
      - name: Verify the release assets are attested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verified
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir verified --clobber
          for asset in main.js manifest.json styles.css; do
            gh attestation verify "verified/$asset" --repo "$GITHUB_REPOSITORY"
          done
